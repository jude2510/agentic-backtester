[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "results_summary"
version = "0.1.0"
description = "Results Summarizer agent (Strands/Amazon Nova) — turns raw backtest metrics into a readable performance report"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "strands-agents >= 1.15.0",
    "python-dotenv >= 1.0.0",
    "boto3 >= 1.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.setuptools]
py-modules = []
